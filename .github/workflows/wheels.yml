name: Wheels

# Builds and tests wheels and the sdist, and keeps them as workflow
# artifacts. Nothing is uploaded to PyPI.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "python/**"
      - "package/**"
      - ".github/workflows/wheels.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS_MACOS: "x86_64 arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: python -m pip install build && python -m build --sdist
      - name: Install from the sdist and test
        run: |
          python -m pip install "$(ls dist/*.tar.gz)[test]"
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
