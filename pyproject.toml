[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "bounded-compositions"
dynamic = ["version"]
description = "Count, rank, enumerate and sample bounded integer compositions"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "licenses/*"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.25"]

[project.optional-dependencies]
scipy = ["scipy>=1.15"]
optuna = ["optuna>=4.0"]
test = ["pytest>=8", "scipy>=1.15", "optuna>=4.0", "cmaes"]

[project.urls]
Source = "https://github.com/andreshernandez-spec/bounded-compositions"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["python/bounded_compositions"]
wheel.py-api = "cp312"
cmake.define = { BCOMP_BUILD_PYTHON = "ON", BCOMP_BUILD_TESTS = "OFF" }
sdist.exclude = ["build", "builddir", ".github"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(bounded-compositions VERSION (?P<value>[0-9.]+)'

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.cibuildwheel]
# cp312 builds the abi3 wheel for 3.12 and later.
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux_*", "*-win32", "*_i686"]
test-extras = ["test"]
test-sources = ["python/tests", "tests/data", "tools", "package"]
test-command = "python -m pytest -q python/tests"

[tool.cibuildwheel.macos]
# C++17 library features (std::optional's exceptions) need 10.14 or later.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
